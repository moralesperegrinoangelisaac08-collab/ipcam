<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <title>VIGIA · Monitor de cámaras</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d10;--panel:#12151a;--line:#292d34;--muted:#8e949f;--text:#f5f6f7;--accent:#edff48;--danger:#ff635f}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;min-height:100vh}
    button,input{font:inherit}.topbar{height:70px;padding:0 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:rgba(11,13,16,.92);position:sticky;top:0;z-index:10;backdrop-filter:blur(14px)}
    .brand{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:800;letter-spacing:.16em}.brand-mark{width:29px;height:29px;border-radius:50%;border:8px solid var(--accent);box-shadow:0 0 24px rgba(237,255,72,.18)}
    .top-actions,.view-toggle,.card-actions,.connection{display:flex;align-items:center}.top-actions{gap:10px}.view-toggle{background:#171a1f;border:1px solid var(--line);padding:3px;border-radius:9px}.view-toggle button,.icon-btn,.primary-btn{border:0;color:var(--muted);background:transparent;cursor:pointer;border-radius:6px}.view-toggle button{padding:8px 12px;font-size:12px;font-weight:700}.view-toggle button.active{background:#2a2e34;color:white}.primary-btn{background:var(--accent);color:#111;padding:10px 15px;font-size:13px;font-weight:800}.icon-btn{width:38px;height:38px;border:1px solid var(--line);font-size:17px}.icon-btn:hover{color:white;background:#20242a}
    main{padding:28px;max-width:1720px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.18em;font-weight:800;text-transform:uppercase}.page-head h1{font-size:28px;margin:7px 0 4px;letter-spacing:-.03em}.page-head p{margin:0;color:var(--muted);font-size:13px}.connection{gap:8px;color:#a7acb5;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(237,255,72,.1)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid.single .camera-card:not(.selected){display:none}.grid.single{grid-template-columns:1fr}.camera-card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--panel);min-width:0}.camera-card.selected{border-color:#4b5058}.video{position:relative;aspect-ratio:16/9;background:#08090b;overflow:hidden}.video img{width:100%;height:100%;display:block;object-fit:cover}.video.contain img{object-fit:contain}.video.empty img{display:none}.empty-state{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:#707680;background:radial-gradient(circle at center,#171a1f 0,#08090b 68%)}.video.empty .empty-state{display:grid}.empty-icon{width:52px;height:52px;border:1px solid #343942;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;font-size:20px}.empty-state strong{color:#b4b8bf;font-size:14px}.empty-state span{display:block;font-size:12px;margin-top:5px}.live{position:absolute;left:14px;top:14px;background:rgba(9,10,12,.82);border:1px solid rgba(255,255,255,.14);padding:6px 9px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.12em}.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--danger);margin-right:6px}.timestamp{position:absolute;right:14px;top:14px;font:600 11px ui-monospace,monospace;background:rgba(9,10,12,.72);padding:6px 8px;border-radius:5px}.card-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 15px}.camera-meta{min-width:0}.camera-meta strong{display:block;font-size:14px}.camera-meta span{display:block;color:var(--muted);font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}.card-actions{gap:5px}.card-actions .icon-btn{border:0;width:34px;height:34px}.card-actions button.recording{color:var(--danger);background:rgba(255,99,95,.12)}
    .statusbar{display:flex;justify-content:space-between;gap:20px;margin-top:24px;padding:15px 2px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}.legend{display:flex;gap:18px}.legend b{color:#d6d8dc;font-weight:600}.kbd{border:1px solid #383c43;border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:#aeb2b9}
    dialog{border:1px solid #343840;border-radius:14px;background:#15181d;color:white;padding:0;width:min(470px,calc(100% - 28px));box-shadow:0 24px 70px #000}dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}.modal-head{padding:21px 23px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start}.modal-head h2{font-size:18px;margin:0}.modal-head p{color:var(--muted);font-size:12px;margin:5px 0 0}.modal-body{padding:20px 23px}.field{margin-bottom:16px}.field label{display:block;font-size:11px;color:#b5bac2;margin-bottom:7px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.field input{width:100%;background:#0e1013;border:1px solid #343840;border-radius:8px;color:white;padding:11px 12px;outline:none}.field input:focus{border-color:var(--accent)}.modal-actions{display:flex;justify-content:flex-end;gap:9px;padding-top:7px}.secondary{padding:10px 14px;border:1px solid var(--line);background:transparent;color:#d9dbe0;border-radius:7px;cursor:pointer}
    @media(max-width:820px){.topbar{padding:0 16px}.view-toggle{display:none}main{padding:20px 14px}.page-head{align-items:start}.connection{display:none}.grid{grid-template-columns:1fr}.camera-meta span{max-width:55vw}.statusbar{display:none}.brand span:last-child{display:none}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark"></span><span>VIGIA</span><span style="font-weight:500;color:#676c75;letter-spacing:.04em">/ MONITOR</span></div><div class="top-actions"><div class="view-toggle"><button class="active" data-view="grid">▦ &nbsp;CUADRÍCULA</button><button data-view="single">▣ &nbsp;INDIVIDUAL</button></div><button class="primary-btn" id="configure">＋ Configurar cámaras</button></div></header>
  <main>
    <section class="page-head"><div><div class="eyebrow">Centro de vigilancia</div><h1>Vista en directo</h1><p>Supervisa tus espacios, en un solo lugar.</p></div><div class="connection"><span class="dot"></span><span id="onlineCount">0 de 2 cámaras conectadas</span></div></section>
    <section class="grid" id="grid"></section>
    <footer class="statusbar"><div class="legend"><span><b>Calidad</b> · MJPEG</span><span><b>Actualización</b> · Tiempo real</span></div><div><span class="kbd">1</span> <span class="kbd">2</span> seleccionar cámara &nbsp;·&nbsp; <span class="kbd">F</span> pantalla completa</div></footer>
  </main>
  <dialog id="settings"><form method="dialog" id="settingsForm"><div class="modal-head"><div><h2>Configurar cámaras</h2><p>Introduce la dirección base de cada cámara Wi‑Fi.</p></div><button class="icon-btn" value="cancel" aria-label="Cerrar">×</button></div><div class="modal-body"><div class="field"><label for="name1">Nombre de cámara 1</label><input id="name1" maxlength="32" placeholder="Entrada principal"></div><div class="field"><label for="url1">Dirección de cámara 1</label><input id="url1" inputmode="url" placeholder="http://192.168.1.41:4444"></div><div class="field"><label for="name2">Nombre de cámara 2</label><input id="name2" maxlength="32" placeholder="Patio trasero"></div><div class="field"><label for="url2">Dirección de cámara 2</label><input id="url2" inputmode="url" placeholder="http://192.168.1.42:4444"></div><div class="modal-actions"><button class="secondary" value="cancel">Cancelar</button><button class="primary-btn" value="default" id="save">Guardar cambios</button></div></div></form></dialog>
  <script>
    const hostedByCamera=location.protocol==='http:'||location.protocol==='https:';
    const fallback=[{name:'Cámara principal',url:hostedByCamera?location.origin:''},{name:'Segunda cámara',url:''}];
    let cameras=JSON.parse(localStorage.getItem('vigia-cameras')||'null')||fallback,selected=0;
    const grid=document.querySelector('#grid'),dialog=document.querySelector('#settings');
    const clean=url=>url.trim().replace(/\/$/,'');
    const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function card(cam,i){const enabled=Boolean(cam.url);return `<article class="camera-card ${i===selected?'selected':''}" data-index="${i}"><div class="video ${enabled?'':'empty'}"><img alt="Emisión en directo de ${esc(cam.name)}" src="${enabled?esc(clean(cam.url))+'/video/mjpeg':''}"><div class="empty-state"><div><div class="empty-icon">⌁</div><strong>Cámara sin configurar</strong><span>Añade una dirección para comenzar</span></div></div>${enabled?'<span class="live">EN DIRECTO</span><time class="timestamp">--:--:--</time>':''}</div><div class="card-footer"><div class="camera-meta"><strong>${esc(cam.name)}</strong><span>${enabled?esc(clean(cam.url)):'Sin dirección asignada'}</span></div><div class="card-actions"><button class="icon-btn snapshot" title="Tomar captura" ${enabled?'':'disabled'}>⌁</button><button class="icon-btn fit" title="Ajustar imagen" ${enabled?'':'disabled'}>⛶</button><button class="icon-btn expand" title="Pantalla completa" ${enabled?'':'disabled'}>↗</button></div></div></article>`}
    function render(){grid.innerHTML=cameras.map(card).join('');bind();updateCount()}
    function bind(){document.querySelectorAll('.camera-card').forEach(card=>{const i=+card.dataset.index,video=card.querySelector('.video'),img=card.querySelector('img');card.addEventListener('click',()=>select(i));if(img){img.addEventListener('load',updateCount);img.addEventListener('error',()=>{video.classList.add('empty');updateCount()})}card.querySelector('.fit')?.addEventListener('click',e=>{e.stopPropagation();video.classList.toggle('contain')});card.querySelector('.expand')?.addEventListener('click',e=>{e.stopPropagation();video.requestFullscreen?.()});card.querySelector('.snapshot')?.addEventListener('click',e=>{e.stopPropagation();window.open(clean(cameras[i].url)+'/video/snapshot','_blank')})})}
    function select(i){selected=i;document.querySelectorAll('.camera-card').forEach((c,n)=>c.classList.toggle('selected',n===i))}
    function updateCount(){const n=[...document.querySelectorAll('.video')].filter(x=>!x.classList.contains('empty')).length;document.querySelector('#onlineCount').textContent=`${n} de 2 cámaras conectadas`}
    function tick(){const now=new Date().toLocaleTimeString('es-ES',{hour12:false});document.querySelectorAll('.timestamp').forEach(x=>x.textContent=now)}setInterval(tick,1000);tick();
    document.querySelector('#configure').onclick=()=>{cameras.forEach((c,i)=>{document.querySelector('#name'+(i+1)).value=c.name;document.querySelector('#url'+(i+1)).value=c.url});dialog.showModal()};
    document.querySelector('#save').onclick=e=>{e.preventDefault();cameras=[1,2].map((n,i)=>({name:document.querySelector('#name'+n).value.trim()||fallback[i].name,url:clean(document.querySelector('#url'+n).value)}));localStorage.setItem('vigia-cameras',JSON.stringify(cameras));dialog.close();render()};
    document.querySelectorAll('[data-view]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===btn));grid.classList.toggle('single',btn.dataset.view==='single')});
    addEventListener('keydown',e=>{if(e.key==='1'||e.key==='2')select(+e.key-1);if(e.key.toLowerCase()==='f')document.querySelectorAll('.video')[selected]?.requestFullscreen?.()});render();
  </script>
</body>
</html>
